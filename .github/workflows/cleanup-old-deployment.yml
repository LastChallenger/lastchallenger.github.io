name: Remove obsolete deployment artifact

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-old-deployment.yml]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the superseded deployment and its artifacts
        env:
          HOMEPAGE_CLEANUP_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          url = 'https://api.github.com/repos/LastChallenger/lastchallenger.github.io/actions/runs/39648496868'
          request = urllib.request.Request(url, method='DELETE', headers={
              'Authorization': 'Bearer ' + os.environ['HOMEPAGE_CLEANUP_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print('Obsolete deployment removed:', response.status)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print('Obsolete deployment is already absent.')
          PY
